[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-ad-bench"
version = "0.4.0"
description = "Runner, telemetry, evaluator, and offline reports for the 0 A.D. strategic agent benchmark."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zero-ad-bench = "zero_ad_bench.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
